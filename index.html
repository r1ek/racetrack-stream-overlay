<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Racetrack stream overlay</title>
<style>
  :root { --s: 1; --bg: rgba(0,0,0,.55); --fg: #fff; --acc: #ffcc00; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Roboto Condensed", "Arial Narrow", Arial, sans-serif; color: var(--fg); }
  .box { position: absolute; background: var(--bg); border-radius: calc(1.2vmin * var(--s));
    padding: calc(1vmin * var(--s)) calc(1.6vmin * var(--s)); text-shadow: 0 1px 1px #000; }
  .num { font-variant-numeric: tabular-nums; font-family: "Roboto Mono", Menlo, Consolas, monospace; }
  #team { top: 2vmin; left: 2vmin; max-width: 42vw; font-size: calc(3.2vmin * var(--s)); line-height: 1.15; }
  #team > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #team .drv { color: var(--acc); font-size: calc(2.8vmin * var(--s)); }
  #team .clk { font-size: calc(2.4vmin * var(--s)); opacity: .85; }
  #ig { left: 2vmin; bottom: calc(16vmin * var(--s)); display: flex; align-items: center; gap: 1vmin;
    font-size: calc(2.8vmin * var(--s)); font-weight: 700; letter-spacing: .03em; }
  #ig svg { width: calc(3.6vmin * var(--s)); height: calc(3.6vmin * var(--s)); flex: none; }
  #lap { top: 2vmin; right: 2vmin; text-align: right; font-size: calc(3vmin * var(--s)); line-height: 1.2; min-width: calc(30vmin * var(--s)); }
  #lap .cur { font-size: calc(6.5vmin * var(--s)); font-weight: 700; }
  #lap .lbl { opacity: .75; font-size: .8em; margin-right: .4em; }
  #lap .best { color: #7CFC7C; }
  #lap .dpos { color: #ff7070; } #lap .dneg { color: #7CFC7C; }
  #stint { top: 2vmin; right: 2vmin; text-align: right; font-size: calc(3vmin * var(--s)); line-height: 1.25; min-width: calc(28vmin * var(--s)); }
  #stint .hd { color: var(--acc); font-weight: 700; }
  #stint .avg, #stint .top { font-size: 1.6em; font-weight: 700; }
  #stint .lbl { opacity: .75; font-size: .8em; margin-right: .4em; }
  #stint small { font-size: .7em; opacity: .8; }
  #stint .prv, #stint .tot { font-size: .8em; opacity: .85; }
  #spd { bottom: 2vmin; left: 2vmin; font-size: calc(10vmin * var(--s)); font-weight: 700; line-height: 1; }
  #spd small { font-size: .35em; font-weight: 400; margin-left: .2em; }
  #spd .warn { display: none; font-size: .3em; font-weight: 700; color: #ff5050; }
  #spd.stale .warn { display: block; }
  #spd.stale .v { opacity: .4; }
  #map { bottom: 2vmin; right: 2vmin; padding: calc(.8vmin * var(--s)); }
  #map canvas { display: block; width: calc(30vmin * var(--s)); height: calc(30vmin * var(--s)); }
  #st { position: absolute; bottom: .4vmin; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.5);
    padding: 0 1vmin; border-radius: .6vmin; font-size: calc(1.8vmin * var(--s)); max-width: 50vw; text-align: center; }
  #lap.stale .cur { opacity: .4; }
  #st.err { color: #ff6060; font-size: calc(2.6vmin * var(--s)); }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="team" class="box"><div class="nm"></div><div class="drv"></div><div class="clk num"></div></div>
<div id="stint" class="box">
  <div class="hd"></div>
  <div><span class="lbl">KESKMINE</span><span class="avg num">–</span><small> km/h</small></div>
  <div><span class="lbl">TIPP</span><span class="top num">–</span><small> km/h</small></div>
  <div class="prv num"></div>
  <div class="tot num"></div>
</div>
<div id="lap" class="box">
  <div><span class="lbl">RING</span><span class="n num">–</span></div>
  <div class="cur num">–:––.–</div>
  <div><span class="lbl">EELMINE</span><span class="last num">–</span> <span class="delta num"></span></div>
  <div><span class="lbl">PARIM</span><span class="best num">–</span></div>
</div>
<div id="ig" class="box hide"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".6" stop-color="#d62976"/><stop offset=".8" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect x="1" y="1" width="22" height="22" rx="6" fill="url(#igg)"/><rect x="5.5" y="5.5" width="13" height="13" rx="4" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="#fff" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.2" fill="#fff"/></svg><span></span></div>
<div id="spd" class="box num"><span class="v">–</span><small>km/h</small><div class="warn">GPS KADUNUD</div></div>
<div id="map" class="box"><canvas width="300" height="300"></canvas></div>
<div id="st" class="num"></div>

<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  function num(name, def, lo, hi) {
    var v = parseFloat(q.get(name));
    return isFinite(v) && v >= lo && v <= hi ? v : def;
  }
  var cfg = {
    team: q.has('team') ? q.get('team') : 'Opel Astra',
    car: q.get('car') || '',
    drivers: (q.get('drivers') || '').split(',').filter(Boolean).map(function (s) {
      var a = s.split('@'), hm = (a[1] || '0:0').split(':').map(Number);
      return { name: a[0].trim(), min: (hm[0] || 0) * 60 + (hm[1] || 0) };
    }).sort(function (a, b) { return a.min - b.min; }),
    start: q.has('start') ? q.get('start') : '12:00',
    dur: num('dur', 8, 0, 48),
    laps: q.get('laps') === '1',
    ig: q.has('ig') ? q.get('ig') : 'WTF.motorsport',
    minLap: num('minlap', 60, 10, 900),        // s; Mannergute short layout dry minimum is 1:27
    gate: num('gate', 25, 5, 80),              // m, lateral half-width of the timing line
    maxAcc: num('maxacc', 30, 5, 200),         // m, reject worse fixes
    maxGap: num('maxgap', 5, 1, 60),           // s, longer gaps break continuity
    rtirl: q.get('rtirl'),
    demo: q.has('demo'),
    speedup: num('speedup', 1, 1, 100),
    sf: q.get('sf'),
  };
  cfg.key = 'mmov2:' + (cfg.demo ? 'demo:' : 'live:') + (q.get('session') || 'default');
  document.documentElement.style.setProperty('--s', String(num('scale', 1, 0.3, 4)));
  var hidden = (q.get('hide') || '').split(',').filter(Boolean);
  hidden.forEach(function (id) { var el = document.getElementById(id); if (el) el.classList.add('hide'); });

  // one clock for everything; in demo it is the simulation clock
  var simT = null, simReal = 0;
  function now() {
    if (cfg.demo && simT != null) return simT + Math.min(1000, (Date.now() - simReal) * cfg.speedup);
    return Date.now();
  }

  var elCache = {};
  function $(s) { return elCache[s] || (elCache[s] = document.querySelector(s)); }
  function setText(s, v) { var e = $(s); if (e.textContent !== v) e.textContent = v; }
  function fmt(ms) {
    if (ms == null || !isFinite(ms)) return '–';
    var d = Math.round(Math.max(0, ms) / 100), m = Math.floor(d / 600), s = (d % 600) / 10;
    return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
  }
  function fmtHMS(ms) {
    var t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
    return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function angDiff(a, b) { return Math.abs(((a - b) % 360 + 540) % 360 - 180); }
  function hdg(a, b) { return (Math.atan2(b.x - a.x, b.y - a.y) * 180 / Math.PI + 360) % 360; }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  var origin = null;
  function proj(lat, lon) {
    if (!origin) origin = { lat: lat, lon: lon, k: Math.cos(lat * Math.PI / 180) };
    return { x: (lon - origin.lon) * origin.k * 111320, y: (lat - origin.lat) * 110540 };
  }

  function fresh() { return { v: 2, anchor: null, outline: null, laps: [], best: null, lastCross: null, armed: true, unc: false, origin: null, hours: {}, km: 0 }; }
  function valid(o) {
    return o && o.v === 2 && o.origin && isFinite(o.origin.lat) && isFinite(o.origin.lon) && Array.isArray(o.laps) &&
      (o.anchor == null || (isFinite(o.anchor.x) && isFinite(o.anchor.y) && isFinite(o.anchor.h))) &&
      (o.outline == null || Array.isArray(o.outline)) && (o.lastCross == null || (isFinite(o.lastCross) && o.lastCross <= Date.now() + 5000));
  }
  var S = fresh(), saveErr = '';
  if (!cfg.demo) {
    try {
      if (q.get('reset') === '1') localStorage.removeItem(cfg.key);
      var saved = JSON.parse(localStorage.getItem(cfg.key) || 'null');
      if (valid(saved)) {
        S = saved; origin = saved.origin;
        if (!S.hours || typeof S.hours !== 'object') S.hours = {};
        if (!isFinite(S.km)) S.km = 0;
        S.armed = false;                       // re-arm only after leaving the line area
        S.unc = S.lastCross != null;           // the lap in progress lost its continuity
      }
    } catch (e) { saveErr = 'salvestus ei tööta'; }
  }
  function save() {
    if (cfg.demo) return;
    try { S.origin = origin; localStorage.setItem(cfg.key, JSON.stringify(S)); saveErr = ''; }
    catch (e) { saveErr = 'salvestus ei tööta'; }
  }
  function applySf() {
    if (!cfg.sf || S.anchor) return;
    var a = cfg.sf.split(',').map(Number);
    if (a.length === 3 && Math.abs(a[0]) <= 90 && Math.abs(a[1]) <= 180 && isFinite(a[2])) {
      var p = proj(a[0], a[1]); S.anchor = { x: p.x, y: p.y, h: a[2] }; S.armed = true;
    }
  }
  applySf();
  if (cfg.ig && hidden.indexOf('ig') < 0) {
    var igEl = document.getElementById('ig');
    igEl.querySelector('span').textContent = '@' + cfg.ig.replace(/^@/, '').toUpperCase();
    igEl.classList.remove('hide');
  }

  var hist = [];           // recent moving points {x,y,t,h,d}
  var prev = null;         // last accepted point
  var lastGood = null, lastAcc = null, speedKmh = null, farCount = 0, odo = 0, pending = null, jumps = 0;
  var skew = [], clockOff = 0, histBreak = true;

  function onFix(f) {
    if (f.acc != null && f.acc > cfg.maxAcc) { lastAcc = f.acc; return; }
    // measurement time is on the device clock (same phone); only a consistent skew over 20 fixes
    // (spread < 1 s) is adopted as an offset, so delayed deliveries never become fresh
    var t = now();
    if (isFinite(f.t)) {
      t = f.t + clockOff;
      var age = now() - t;
      if (age > 3000 || age < -2000) {
        skew.push(now() - f.t); if (skew.length > 20) skew.shift();
        var mn = Math.min.apply(null, skew), mx = Math.max.apply(null, skew);
        if (skew.length === 20 && mx - mn < 1000) { clockOff = (mn + mx) / 2; skew = []; }
        return;
      }
      skew = [];
    }
    if (prev && t <= prev.t) return;                     // non-monotonic
    var p = proj(f.lat, f.lon);
    if (Math.hypot(p.x, p.y) > 2000) {                 // far from saved origin: another place?
      if (++farCount < 5) return;
      S = fresh(); origin = null; hist = []; prev = null; odo = 0; farCount = 0; pending = null;
      p = proj(f.lat, f.lon); applySf(); save();
    } else farCount = 0;
    p.t = t;
    var v = (f.speed != null && isFinite(f.speed) && f.speed >= 0) ? f.speed : null;
    if (prev) {
      var dt = (p.t - prev.t) / 1000, d = dist(p, prev);
      if (dt < 0.3) return;                              // duplicate / burst
      if (d / dt > 90) {                                 // outlier; 3 in a row = prev was the bad one
        if (++jumps < 3) return;
        prev = null; pending = null; jumps = 0; histBreak = true;
        if (S.anchor) S.unc = true; else hist = [];
      }
      else jumps = 0;
      if (!prev) { /* fall through: restart continuity at p */ }
      else if (dt > cfg.maxGap) {
        S.unc = true; prev = null; pending = null; histBreak = true;
        if (!S.anchor) hist = [];                        // never learn across an unobserved stretch
      } else {
        if (v == null) v = d / dt;
        p.h = d > 3 ? hdg(prev, p) : prev.h;
        if (v > 2) odo += d;
        p.d = odo;
        if (S.anchor && cfg.laps) checkGate(prev, p);
        accumulate(prev, p, d, dt, v);
      }
    }
    if (p.d == null) p.d = odo;
    if (S.anchor && pending) confirm(p);
    lastGood = now(); lastAcc = f.acc;
    var kmh = v == null ? null : v * 3.6;
    speedKmh = kmh == null ? null : (speedKmh == null ? kmh : speedKmh * 0.4 + kmh * 0.6);
    if (v != null && v > 5 && p.h != null) {
      p.brk = histBreak; histBreak = false;              // segment to this point was not fully observed
      hist.push(p);
      if (!S.anchor) learn(p);
      var cutoff = p.t - 15 * 60 * 1000;
      while (hist.length && hist[0].t < cutoff) hist.shift();
    }
    if (!(v != null && v > 5)) histBreak = true;
    if (S.anchor && !S.armed && dist(p, S.anchor) > 150) { S.armed = true; save(); }
    prev = p;
    mapDirty = true;
  }

  // Loop closure against historical segments: the newest earlier pass within 15 m, same direction,
  // at least minLap s and 600 m driven ago, having been >100 m away in between.
  function learn(p) {
    if (hist.length < 3 || p.h == null) return;
    for (var i = hist.length - 3; i >= 0; i--) {
      var a = hist[i], b = hist[i + 1];
      if (b.brk) continue;
      if (p.t - b.t < cfg.minLap * 1000 || p.d - b.d < 600) continue;
      var sx = b.x - a.x, sy = b.y - a.y, L2 = sx * sx + sy * sy;
      if (L2 < 1) continue;
      var u = Math.max(0, Math.min(1, ((p.x - a.x) * sx + (p.y - a.y) * sy) / L2));
      var c = { x: a.x + sx * u, y: a.y + sy * u };
      if (dist(p, c) > 15) continue;
      var h = hdg(a, b);
      if (angDiff(p.h, h) > 45) continue;
      var left = false;
      for (var j = i + 1; j < hist.length; j++) if (dist(hist[j], c) > 100) { left = true; break; }
      if (!left) continue;
      S.anchor = { x: c.x, y: c.y, h: h };
      S.outline = simplify(hist.slice(i + 1).map(function (o) { return [o.x, o.y]; }));
      S.armed = true; S.lastCross = null; S.unc = false; pending = null;
      if (prev) checkGate(prev, p);                     // timing starts at the first real crossing
      save();
      return;
    }
  }

  // Two stages: a sign change across the line (with lateral check) becomes a pending crossing with
  // its interpolated time; it is committed only once the car is 20 m past the line. GPS jitter around
  // a parked car never gets 20 m past, while slow real crossings still count.
  function along(p) {
    var A = S.anchor, r = A.h * Math.PI / 180, ux = Math.sin(r), uy = Math.cos(r);
    var dx = p.x - A.x, dy = p.y - A.y;
    return { s: dx * ux + dy * uy, l: dx * uy - dy * ux };
  }
  function checkGate(a, b) {
    if (!S.anchor || !S.armed || pending) return;
    var A1 = along(a), B1 = along(b);
    if (!(A1.s < 0 && B1.s >= 0) || A1.s < -250 || B1.s > 250) return;
    var f = -A1.s / (B1.s - A1.s);
    if (Math.abs(A1.l + (B1.l - A1.l) * f) > cfg.gate) return;
    pending = { tc: a.t + (b.t - a.t) * f, t: b.t, x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
    confirm(b);
  }
  function confirm(p) {
    var P = along(p);
    if (P.s < -10 || p.t - pending.t > 60000) { pending = null; return; }   // backed off / never completed
    if (P.s < 20 || Math.abs(P.l) > cfg.gate * 2) return;
    var ok = angDiff(hdg(pending, p), S.anchor.h) <= 60;
    var slowConfirm = p.t - pending.t > 8000;            // lingered at the line: crossing time unreliable
    var tc = pending.tc; pending = null;
    if (ok) { if (slowConfirm) S.unc = true; commit(tc); }
  }
  function commit(tc) {
    if (S.lastCross != null && tc - S.lastCross < cfg.minLap * 1000) return;
    if (S.lastCross != null) {
      addLap(tc - S.lastCross, S.unc);
      if (!S.outline || S.outline.length < 10) {
        var pts = hist.filter(function (h) { return h.t >= S.lastCross; }).map(function (h) { return [h.x, h.y]; });
        if (pts.length > 10) S.outline = simplify(pts);
      }
    }
    S.lastCross = tc; S.armed = false; S.unc = false;
    save();
  }

  function raceStart(t) {
    if (!cfg.start) return null;
    var hm = cfg.start.split(':').map(Number), s0 = new Date(t); s0.setHours(hm[0] || 0, hm[1] || 0, 0, 0);
    return s0.getTime();
  }
  var spdWin = [];
  function accumulate(a, b, d, dt, v) {
    var st = raceStart(b.t);
    if (st == null || b.t < st || (cfg.dur && b.t > st + cfg.dur * 3600e3)) return;
    var h = Math.floor((b.t - st) / 3600e3), H = S.hours[h] || (S.hours[h] = { d: 0, t: 0, max: 0 });
    var kmh = v * 3.6;
    if (kmh > 20) { H.d += d; H.t += dt; }                // track running only: pit stops excluded
    spdWin.push(kmh); if (spdWin.length > 3) spdWin.shift();
    if (spdWin.length === 3) {                           // median of 3 rejects single-fix spikes
      var m = spdWin.slice().sort(function (x, y) { return x - y; })[1];
      if (m > H.max && m < 300) H.max = m;
    }
    if (kmh > 2) S.km += d / 1000;
    if (++accN % 10 === 0) save();
  }
  var accN = 0;

  function addLap(ms, unc) {
    var slow = unc || (S.best != null && ms > S.best * 1.5) || ms > 180000;
    S.laps.push({ ms: ms, slow: slow, unc: !!unc, ref: S.best });
    if (!slow && (S.best == null || ms < S.best)) S.best = ms;
    if (S.laps.length > 1000) S.laps.shift();
  }

  function simplify(pts) {
    var out = [], last = null;
    pts.forEach(function (p) { if (!last || Math.hypot(p[0] - last[0], p[1] - last[1]) > 6) { out.push(p); last = p; } });
    return out;
  }

  // map: redrawn only when a fix arrives
  var cv = $('#map canvas'), cx = cv.getContext('2d'), mapDirty = true;
  function drawMap() {
    var w = cv.width, h = cv.height; cx.clearRect(0, 0, w, h);
    var outlined = S.outline && S.outline.length > 10;
    var pts = outlined ? S.outline : hist.map(function (a) { return [a.x, a.y]; });
    if (pts.length < 2) {
      cx.fillStyle = '#fff'; cx.font = '22px sans-serif'; cx.textAlign = 'center';
      cx.fillText(lastGood ? 'raja õppimine…' : 'ootan GPS-i…', w / 2, h / 2); return;
    }
    var all = prev ? pts.concat([[prev.x, prev.y]]) : pts;
    var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    all.forEach(function (p) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
    var pad = 18, sc = Math.min((w - 2 * pad) / Math.max(1, x1 - x0), (h - 2 * pad) / Math.max(1, y1 - y0));
    var ox = (w - (x1 - x0) * sc) / 2, oy = (h - (y1 - y0) * sc) / 2;
    function X(x) { return ox + (x - x0) * sc; }
    function Y(y) { return h - (oy + (y - y0) * sc); }
    cx.lineJoin = cx.lineCap = 'round';
    [[10, 'rgba(0,0,0,.7)'], [5, '#fff']].forEach(function (st) {
      cx.beginPath();
      pts.forEach(function (p, i) { if (i) cx.lineTo(X(p[0]), Y(p[1])); else cx.moveTo(X(p[0]), Y(p[1])); });
      if (outlined) cx.closePath();
      cx.lineWidth = st[0]; cx.strokeStyle = st[1]; cx.stroke();
    });
    if (S.anchor && cfg.laps) {
      var r = S.anchor.h * Math.PI / 180, px = Math.cos(r), py = Math.sin(r), X0 = X(S.anchor.x), Y0 = Y(S.anchor.y);
      cx.beginPath(); cx.moveTo(X0 + px * 12, Y0 + py * 12); cx.lineTo(X0 - px * 12, Y0 - py * 12);
      cx.lineWidth = 5; cx.strokeStyle = '#ffcc00'; cx.stroke();
    }
    if (prev) {
      cx.globalAlpha = lastStale ? 0.35 : 1;
      cx.beginPath(); cx.arc(X(prev.x), Y(prev.y), 9, 0, 7); cx.fillStyle = '#ff2a2a'; cx.fill();
      cx.lineWidth = 3; cx.strokeStyle = '#fff'; cx.stroke(); cx.globalAlpha = 1;
    }
  }

  function driverNow(t) {
    if (!cfg.drivers.length) return '';
    var d = new Date(t), m = d.getHours() * 60 + d.getMinutes(), cur = cfg.drivers[0];
    cfg.drivers.forEach(function (x) { if (x.min <= m) cur = x; });
    return cur.name;
  }

  var src = '', errMsg = '', lastStale = false;
  function render() {
    var t = now();
    var name = [cfg.car && ('#' + cfg.car), cfg.team].filter(Boolean).join(' ');
    var drv = driverNow(t), clk = '';
    if (cfg.start) {
      var hm = cfg.start.split(':').map(Number), s = new Date(t); s.setHours(hm[0] || 0, hm[1] || 0, 0, 0);
      var el = t - s.getTime();
      if (el >= 0 && (!cfg.dur || el < cfg.dur * 3600e3 + 3600e3)) clk = fmtHMS(el) + (cfg.dur ? '  / jäänud ' + fmtHMS(cfg.dur * 3600e3 - el) : '');
    }
    setText('#team .nm', name);
    setText('#team .drv', drv ? 'Roolis: ' + drv : '');
    setText('#team .clk', clk);
    if (hidden.indexOf('team') < 0) $('#team').classList.toggle('hide', !name && !clk && !drv);

    var st0 = raceStart(t), hIdx = st0 != null && t >= st0 ? Math.floor((t - st0) / 3600e3) : -1;
    if (hIdx < 0) setText('#stint .hd', 'START ' + cfg.start);
    else if (cfg.dur && hIdx >= cfg.dur) setText('#stint .hd', 'FINIŠ');
    else {
      var h0 = new Date(st0 + hIdx * 3600e3), h1 = new Date(st0 + (hIdx + 1) * 3600e3);
      setText('#stint .hd', (hIdx + 1) + '. TUND  ' + h0.getHours() + '–' + h1.getHours());
    }
    var cur = S.hours[Math.min(hIdx, cfg.dur ? cfg.dur - 1 : hIdx)] || null, prv = hIdx > 0 ? S.hours[hIdx - 1] : null;
    setText('#stint .avg', cur && cur.t > 30 ? String(Math.round(cur.d / cur.t * 3.6)) : '–');
    setText('#stint .top', cur && cur.max ? String(Math.round(cur.max)) : '–');
    setText('#stint .prv', prv && prv.t > 30 ? 'eelmine tund: ' + Math.round(prv.d / prv.t * 3.6) + ' / ' + Math.round(prv.max) + ' km/h' : '');
    setText('#stint .tot', S.km > 0.1 ? 'kokku ' + S.km.toFixed(1) + ' km' : '');

    var n = S.laps.length, last = n ? S.laps[n - 1] : null;
    setText('#lap .n', S.lastCross != null ? String(n + 1) : '–');
    setText('#lap .cur', S.lastCross != null ? fmt(t - S.lastCross) : '–:––.–');
    setText('#lap .last', last ? fmt(last.ms) + (last.unc ? ' (?)' : last.slow ? ' (boks/aegl.)' : '') : '–');
    var dl = $('#lap .delta');
    if (last && !last.slow && last.ref != null) {
      var dd = Math.round((last.ms - last.ref) / 100) / 10;
      dl.textContent = dd === 0 ? '±0.0' : (dd > 0 ? '+' : '') + dd.toFixed(1);
      dl.className = 'delta num ' + (dd > 0 ? 'dpos' : dd < 0 ? 'dneg' : '');
    } else dl.textContent = '';
    setText('#lap .best', fmt(S.best));

    var age = lastGood ? (t - lastGood) / 1000 : null, stale = age == null || age > 4;
    setText('#spd .v', (speedKmh == null || stale) ? '–' : String(Math.round(speedKmh < 3 ? 0 : speedKmh)));
    $('#spd').classList.toggle('stale', lastGood != null && stale);
    $('#lap').classList.toggle('stale', lastGood != null && stale);
    if (stale !== lastStale) { lastStale = stale; mapDirty = true; }
    if (mapDirty) { drawMap(); mapDirty = false; }

    // bottom line only for setup errors (GPS permission/source); GPS loss is shown in the speed box
    var stEl = $('#st'), msg = errMsg;
    if (cfg.demo && !msg) msg = 'DEMO';
    stEl.className = msg ? 'num err' : 'num hide';
    if (stEl.textContent !== msg) stEl.textContent = msg;
  }
  document.getElementById(cfg.laps ? 'stint' : 'lap').classList.add('hide');
  setInterval(render, cfg.laps ? 200 : 1000);

  if (cfg.demo) { src = 'demo'; startDemo(); }
  else if (cfg.rtirl) {
    src = 'RealtimeIRL';
    var sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/@rtirl/api@1.2.5/lib/index.min.js';
    sc.onload = function () {
      try {
        var lastAt = null;
        var api = window.RealtimeIRL.forPullKey(cfg.rtirl, { forceWebSockets: true });
        api.addListener(function (r) {                  // whole record: location, speed, accuracy, reportedAt
          if (!r || !r.location || !isFinite(r.location.latitude)) return;
          if (r.reportedAt != null && r.reportedAt === lastAt) return;
          lastAt = r.reportedAt;
          errMsg = '';
          onFix({ lat: r.location.latitude, lon: r.location.longitude,
            t: isFinite(r.reportedAt) ? r.reportedAt : NaN,
            speed: isFinite(r.speed) ? r.speed : null, acc: isFinite(r.accuracy) ? r.accuracy : null });
        });
      } catch (e) { errMsg = 'RealtimeIRL viga'; }
    };
    sc.onerror = function () { errMsg = 'RealtimeIRL skript ei laadinud'; };
    document.head.appendChild(sc);
  } else if ('geolocation' in navigator) {
    src = 'telefoni GPS';
    navigator.geolocation.watchPosition(
      function (p) { errMsg = ''; onFix({ lat: p.coords.latitude, lon: p.coords.longitude, t: p.timestamp, speed: p.coords.speed, acc: p.coords.accuracy }); },
      function (e) { errMsg = 'GPS viga: ' + (e.code === 1 ? 'luba puudub (lülita äpis geo/asukoht sisse)' : (e.message || e.code)); },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  } else errMsg = 'brauseris pole GPS-i';

  // demo: pit-lane run-in, then laps of a synthetic ~2 km loop at 1 Hz with noise
  function startDemo() {
    var lat0 = 58.4005, lon0 = 24.4505, k = Math.cos(lat0 * Math.PI / 180);
    function shape(th) { var r = 320 + 90 * Math.sin(3 * th) + 40 * Math.cos(5 * th); return [r * Math.cos(th) * 1.3, r * Math.sin(th)]; }
    var th = 0, pit = 12;
    simT = Date.now(); simReal = Date.now();
    setInterval(function () {
      simT += 1000; simReal = Date.now();
      var x, y, v;
      if (pit > 0) { var p0 = shape(0); x = p0[0] - pit * 12; y = p0[1] - 60 + pit * 3; v = 15; pit--; }
      else {
        var curv = Math.abs(Math.sin(3 * th)); v = 22 + 14 * (1 - curv) + (Math.random() - .5) * 2;
        var a = shape(th), b = shape(th + 0.001), seg = Math.hypot(b[0] - a[0], b[1] - a[1]) / 0.001;
        th += v / seg; var c = shape(th); x = c[0]; y = c[1];
      }
      x += (Math.random() - .5) * 4; y += (Math.random() - .5) * 4;
      onFix({ lat: lat0 + y / 110540, lon: lon0 + x / (111320 * k), t: simT, speed: v, acc: 4 });
    }, 1000 / cfg.speedup);
  }
})();
</script>
